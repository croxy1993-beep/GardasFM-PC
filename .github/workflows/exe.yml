name: EXE kurulum paketi

on:
  workflow_dispatch:
  push:
    paths:
      - "gardas_launcher.py"
      - ".github/workflows/exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Depoyu klonla
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyInstaller kurulumu
        run: pip install pyinstaller

      - name: EXE derle
        run: pyinstaller --onefile --noconsole --icon=logo.ico --add-data "logo.png;." gardas_launcher.py -n GardasFM

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installer
          name: Gardas FM Kurulum (EXE)
          files: dist/GardasFM.exe
